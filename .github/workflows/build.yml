name: Build

# Tag v*.*.* -> release. Manual run on master with a version -> release. Anything else only uploads the installer as an artifact.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version x.y.z[-suffix] (required to publish a release from master)'
        required: false
        type: string

permissions:
  contents: read

env:
  WIL_TAG: v1.0.260126.7
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $release = $false
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $release = $true
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION -replace '^v', ''
            $release = $env:GITHUB_REF -eq 'refs/heads/master'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -eq 'refs/heads/master') {
            throw 'Provide the version input to publish a release from master.'
          } else {
            $lastTag = git describe --tags --abbrev=0 2>$null
            if (-not $lastTag) { $lastTag = '0.0.0' }
            $version = "$($lastTag -replace '^v', '')-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$version', expected x.y.z or x.y.z-suffix."
          }
          $numeric = ($version -split '-')[0]
          "VCM_VERSION=$version" >> $env:GITHUB_ENV
          "VCM_VERSION_NUMERIC=$numeric" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (release: $release)"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Get WIL
        shell: pwsh
        run: git clone --depth 1 --branch $env:WIL_TAG https://github.com/microsoft/wil "$env:RUNNER_TEMP/wil"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Native virtual camera DLL
        shell: pwsh
        run: |
          $wil = "$env:RUNNER_TEMP/wil/include" -replace '\\', '/'
          cmake -S src/Vcm.VirtualCamera -B build/cmake-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release "-DWIL_INCLUDE_DIR=$wil" "-DVCM_VERSION=$env:VCM_VERSION_NUMERIC"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/cmake-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out/native | Out-Null
          Copy-Item build/cmake-x64/VcmVirtualCamera.dll out/native/

      - name: Unit tests
        run: dotnet test --project tests/Vcm.Core.Tests

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish src/Vcm.App -c Release -r win-x64 --self-contained false -o out/app -p:DebugType=none "-p:Version=$env:VCM_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path out/app/VcmVirtualCamera.dll)) { throw 'VcmVirtualCamera.dll missing from out/app' }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VCM_VERSION" installer/vcm.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          path: out/VCM-Setup-${{ steps.version.outputs.version }}.exe
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VCM-Setup-${{ needs.build.outputs.version }}.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: VCM-Setup-*.exe
